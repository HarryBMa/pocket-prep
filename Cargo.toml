[package]
name = "pocket-prep"
version = "0.5.0"
description = "Companion prep app for the Pocket Deck: library, analysis, stems, rekordbox-format export, deck updates"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = "8"
mime_guess = "2"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }      # same as clubcraft-core: one bundled SQLite
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serialport = "4"
espflash = { version = "4", default-features = false, features = ["serialport"] }
sysinfo = "0.33"
dirs = "6"
chrono = "0.4"
flacenc = { version = "0.5", features = ["par"] }   # stem files (same version as clubcraft-stems)
blake3 = "1"                                        # fingerprint of the export.pdb we wrote
sha2 = "0.10"                                       # the fetched stems model against the hash the build pinned
claxon = "0.4"                                      # reading stem files back (pure-Rust FLAC decoder)

# Analysis (beat grid, key, energy, sections, auto cues), decoding and stem separation come
# from ClubCraft (MIT OR Apache-2.0), pinned to a reviewed commit.
clubcraft-core = { git = "https://github.com/beneaze/ClubCraft", rev = "d654ccd8710bf132d4587479338290d51632bcfc" }
clubcraft-audio = { git = "https://github.com/beneaze/ClubCraft", rev = "d654ccd8710bf132d4587479338290d51632bcfc" }
clubcraft-analysis = { git = "https://github.com/beneaze/ClubCraft", rev = "d654ccd8710bf132d4587479338290d51632bcfc" }
watershed-separation = { path = "vendor/watershed/crates/separation", optional = true }   # RoFormer stems engine (GPU), from Watershed
watershed-audio = { path = "vendor/watershed/crates/audio" }   # the practice player's engine (Watershed, MIT OR Apache-2.0)
clubcraft-stems = { git = "https://github.com/beneaze/ClubCraft", rev = "d654ccd8710bf132d4587479338290d51632bcfc" }

# Independent rekordbox parser (MPL-2.0): reads the card back after an export (usb::validate) and checks
# our export.pdb and ANLZ files in tests.
rekordcrate = { git = "https://github.com/Holzhaus/rekordcrate", rev = "68cd702e9c78bde4b9eab477e0a7547a0cb69768" }
fallible-iterator = "0.3"
binrw = "0.15"

[features]
default = ["roformer"]
# The BS-RoFormer stems engine (burn + wgpu). Off: a leaner build with htdemucs only.
roformer = ["dep:watershed-separation"]

[dev-dependencies]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Lean installer: one codegen unit with fat LTO, symbols stripped. Panics unwind (no `panic = "abort"`): the RoFormer
# engine reports a GPU failure (no adapter, a buffer the device can't allocate) as a panic that its caller catches and
# turns into a failed job; with abort the whole app would die with it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3                     # DSP and FFT code is far too slow unoptimised

# ClubCraft with Pocket Prep's local fixes (see vendor/clubcraft/README-VENDORED.md).
[patch."https://github.com/beneaze/ClubCraft"]
clubcraft-core = { path = "vendor/clubcraft/crates/core" }
clubcraft-audio = { path = "vendor/clubcraft/crates/audio" }
clubcraft-analysis = { path = "vendor/clubcraft/crates/analysis" }
clubcraft-stems = { path = "vendor/clubcraft/crates/stems" }
