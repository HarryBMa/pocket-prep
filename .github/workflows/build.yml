# Builds the installers for Windows and macOS (Apple Silicon and Intel).
# The Demucs model isn't in git (174 MB): it is exported here from PyTorch, once per run.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export the Demucs model
        shell: bash
        run: |
          uv run --python 3.12 --with demucs==4.0.1 --with torch==2.7.1 --with torchaudio==2.7.1 \
            --with onnx --with onnxruntime --with "numpy<2.3" tools/export_demucs_onnx.py models/htdemucs.onnx
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -- --include-ignored
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-prep-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
