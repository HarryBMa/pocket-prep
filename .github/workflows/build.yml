# Builds the installers: Windows x64 (NSIS, with DirectML and the VC++ runtime; WebView2 via
# its 2 MB bootstrapper), macOS Apple Silicon and Intel (.app + DMG, CoreML model), Linux x64
# (AppImage + .deb). The Demucs model (174 MB) isn't in git and isn't in the Windows/Linux
# installers: the `model` job exports it once, pins its SHA-256 in models/manifest.json (built
# into every app) and publishes it as a release asset the app fetches on request (src/models.rs).
# Builds are unsigned (Windows SmartScreen and macOS Gatekeeper warn).
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export the Demucs model (ONNX) and the mood embedding model
        run: |
          uv run --python 3.12 --with demucs==4.0.1 --with torch==2.7.1 --with torchaudio==2.7.1 \
            --with onnx --with onnxruntime --with "numpy<2.3" tools/export_demucs_onnx.py models
          uv run --python 3.12 --with demucs==4.0.1 --with torch==2.7.1 --with torchaudio==2.7.1 \
            --with onnx --with onnxruntime --with "numpy<2.3" tools/export_demucs_onnx.py models --embedding
      - name: Pin the stems model (models/manifest.json)
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          name = "htdemucs.onnx"
          h = hashlib.sha256(open(f"models/{name}", "rb").read()).hexdigest()
          json.dump({name: {"sha256": h, "bytes": os.path.getsize(f"models/{name}"),
                            "url": f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/{name}"}},
                    open("models/manifest.json", "w"), indent=1)
          print(open("models/manifest.json").read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            models/htdemucs.onnx
            models/htdemucs.json
            models/htdemucs_mood.onnx
            models/manifest.json
      - name: Publish the stems model with the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: models/htdemucs.onnx
          draft: true

  build:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Linux build dependencies (WebKitGTK for Tauri, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libudev-dev libclang-dev cmake mesa-vulkan-drivers
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - name: Export the Demucs model (CoreML)
        if: runner.os == 'macOS'
        run: |
          uv run --python 3.11 --with demucs==4.0.1 --with torch==2.5.1 --with torchaudio==2.5.1 \
            --with coremltools==8.3 --with "numpy<2" tools/export_demucs_onnx.py models --coreml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}
      - name: Installer size
        shell: bash
        run: du -sh target/${{ matrix.target }}/release/bundle/*/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-prep-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
