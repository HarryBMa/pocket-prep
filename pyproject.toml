[project]
name = "pocket-prep"
version = "0.1.0"
description = "Companion prep app for the Pocket Deck: library, analysis, stems (Demucs), rekordbox-format export, deck updates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "mutagen>=1.47",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "demucs==4.0.1",
  "pywebview>=5.0",
  "esptool>=4.8",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
pocket-prep = "pocket_prep.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
